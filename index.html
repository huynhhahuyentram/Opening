<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CREATE 3D OPENING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- IMAGE -->
    <div class="image-box">
        <img id="banner"
             src="https://drive.google.com/uc?export=download&id=1uZGN6ycXnPaFnK3Ace7UrgM7U5BZniIe"
             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,
             <svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;700&quot; height=&quot;200&quot;>
             <rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;#ddd&quot;/>
             <text x=&quot;50%&quot; y=&quot;50%&quot; dominant-baseline=&quot;middle&quot; text-anchor=&quot;middle&quot; font-size=&quot;20&quot; fill=&quot;#555&quot;>
             IMAGE NOT AVAILABLE
             </text></svg>';">
    </div>

    <!-- POSITION + DIMENSIONS -->
    <div class="row">
        <div class="group">
            <h3>Position</h3>
            <label>X [mm]</label><input id="x">
            <label>Y [mm]</label><input id="y">
            <label>Z [mm]</label><input id="z">
        </div>

        <div class="group">
            <h3>Dimensions</h3>
            <label>dX</label><input id="dx">
            <label>dY</label><input id="dy">
            <label>dZ</label><input id="dz">
        </div>
    </div>

    <!-- FRAD -->
    <div class="group">
        <h3>Corner Radius</h3>
        <div class="frad">
            <input id="f1" value="150">
            <input id="f2" value="150">
            <input id="f3" value="150">
            <input id="f4" value="150">
        </div>
    </div>

    <!-- AXIS -->
    <div class="group">
        <h3>Orientation</h3>
        <label><input type="radio" name="axis" value="X"> X</label>
        <label><input type="radio" name="axis" value="Y"> Y</label>
        <label><input type="radio" name="axis" value="Z" checked> Z</label>
    </div>

    <!-- BUTTON -->
    <div class="buttons">
        <button class="btn primary" onclick="saveFile()">OK</button>
        <button class="btn voice" onclick="startVoice()">🎤 Voice</button>
        <button class="btn info" onclick="openHelp()">Help</button>
        <button class="btn danger" onclick="resetForm()">Reset</button>
    </div>

    <!-- CHATBOX -->
    <div class="chatbox">
        <div id="chatLog"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
