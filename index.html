<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Opening Tool</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app">

<canvas id="view"></canvas>

<div class="panel">

<div class="row">
<div>
<h4>Position</h4>
<input id="px" value="0">
<input id="py" value="0">
<input id="pz" value="0">
</div>

<div>
<h4>Dimension</h4>
<input id="dx" value="0">
<input id="dy" value="0">
<input id="dz" value="0">
</div>
</div>

<div>
<h4>Corner Radius</h4>
<div class="radius">
<label>R1<input id="r1" value="150"></label>
<label>R2<input id="r2" value="150"></label>
<label>R3<input id="r3" value="150"></label>
<label>R4<input id="r4" value="150"></label>
</div>
</div>

<div>
<h4>Orientation</h4>
<div class="ori">
<button onclick="setOri('X')" id="ox">X</button>
<button onclick="setOri('Y')" id="oy">Y</button>
<button onclick="setOri('Z')" id="oz" class="active">Z</button>
</div>
</div>

<div class="btns">
<button class="ok" onclick="saveFile()">OK</button>
<button class="voice" onclick="voice()">🎤 Voice</button>
<button class="help" onclick="help()">Help</button>
<button class="reset" onclick="reset()">Reset</button>
</div>

<div id="chat"></div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
