<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CREATE 3D OPENING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- IMAGE -->
    <div class="image-box">
        <img id="banner"
             src="https://drive.google.com/uc?export=view&id=1uZGN6ycXnPaFnK3Ace7UrgM7U5BZniIe"
             onerror="this.onerror=null;this.src='https://via.placeholder.com/800x200?text=IMAGE+NOT+AVAILABLE';">
    </div>

    <!-- POSITION + DIMENSION -->
    <div class="row">

        <!-- POSITION -->
        <div class="group">
            <h3>Position</h3>

            <label>X [mm]</label>
            <input id="x" value="0">

            <label>Y [mm]</label>
            <input id="y" value="0">

            <label>Z [mm]</label>
            <input id="z" value="0">
        </div>

        <!-- DIMENSION -->
        <div class="group">
            <h3>Dimension</h3>

            <label>Length</label>
            <input id="dx">

            <label>Width</label>
            <input id="dy">

            <label>Height</label>
            <input id="dz">
        </div>

    </div>

    <!-- CORNER RADIUS -->
    <div class="group">
        <h3>Corner Radius</h3>

        <div class="frad">
            <div>
                <label>R1</label>
                <input id="f1" value="150">
            </div>

            <div>
                <label>R2</label>
                <input id="f2" value="150">
            </div>

            <div>
                <label>R3</label>
                <input id="f3" value="150">
            </div>

            <div>
                <label>R4</label>
                <input id="f4" value="150">
            </div>
        </div>
    </div>

    <!-- ORIENTATION -->
    <div class="group">
        <h3>Orientation</h3>

        <label><input type="radio" name="axis" value="X"> X</label>
        <label><input type="radio" name="axis" value="Y"> Y</label>
        <label><input type="radio" name="axis" value="Z" checked> Z</label>
    </div>

    <!-- BUTTON -->
    <div class="buttons">
        <button class="btn primary" onclick="saveFile()">OK</button>
        <button class="btn voice" onclick="startVoice()">🎤 Voice</button>
        <button class="btn info" onclick="openHelp()">Help</button>
        <button class="btn danger" onclick="resetForm()">Reset</button>
    </div>

    <!-- CHATBOX -->
    <div class="chatbox">
        <div id="chatLog"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
