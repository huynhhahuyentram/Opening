<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>CREATE 3D OPENING</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- CANVAS -->
<canvas id="canvas3d"></canvas>

<!-- POSITION + DIMENSION -->
<div class="row">

<div class="group">
<h3>Position</h3>
<label>X</label><input id="x" value="0">
<label>Y</label><input id="y" value="0">
<label>Z</label><input id="z" value="0">
</div>

<div class="group">
<h3>Dimension</h3>
<label>Length [mm]</label><input id="dx" value="0">
<label>Width [mm]</label><input id="dy" value="0">
<label>Height [mm]</label><input id="dz" value="0">
</div>

</div>

<!-- CORNER -->
<div class="group">
<h3>Corner Radius</h3>
<div class="frad">
<input id="f1" value="150">
<input id="f2" value="150">
<input id="f3" value="150">
<input id="f4" value="150">
</div>
</div>

<!-- ORIENTATION -->
<div class="group">
<h3>Orientation</h3>
<div class="radio-group">
<label><input type="radio" name="axis" value="X"> X</label>
<label><input type="radio" name="axis" value="Y"> Y</label>
<label><input type="radio" name="axis" value="Z" checked> Z</label>
</div>
</div>

<!-- BUTTON -->
<div class="buttons">
<button class="btn primary" onclick="saveFile()">OK</button>
<button class="btn voice" onclick="startVoice()">🎤 Voice</button>
<button class="btn info" onclick="help()">Help</button>
<button class="btn danger" onclick="resetForm()">Reset</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

</div>

<script src="script.js"></script>

</body>
</html>
